openapi: 3.0.2
info:
  title: Fridge Cloud API - OpenAPI 3.0
  description: Fridge session management API
  version: 1.0.0

servers:
  - url: /api/v1
tags:
  - name: Sessions
    description: Pending fridge sessions
  - name: History
    description: Completed fridge sessions
  - name: Stats
    description: System statistics
  - name: Devices
    description: Device management

paths:
  /sessions:
    get:
      tags:
        - Sessions
      summary: List pending sessions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
  /sessions/{id}:
    get:
      tags:
        - Sessions
      summary: Get pending session detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
  /history:
    get:
      tags:
        - History
      summary: List history sessions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
  /history/{id}:
    get:
      tags:
        - History
      summary: Get history session detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
  /stats:
    get:
      tags:
        - Stats
      summary: Get system statistics
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /admin/devices:
    post:
      tags:
        - Devices
      summary: Register a new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '200':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'

components:
  schemas:
    SessionSummary:
      type: object
      properties:
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        meta:
          type: object
          additionalProperties:
            type: string
        tx_summary:
          type: object
          additionalProperties:
            type: integer
    SessionDetail:
      type: object
      properties:
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        meta:
          type: object
          additionalProperties:
            type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        frames:
          type: array
          items:
            type: string
        frames_subdir:
          type: string
    Status:
      type: object
      properties:
        state:
          type: string
    Transaction:
      type: object
      properties:
        tx_id:
          type: string
        type:
          type: string
          enum:
            - ADD
            - REMOVE
        item:
          $ref: '#/components/schemas/Item'
        confidence:
          type: number
    Item:
      type: object
      properties:
        label:
          type: string
    DiskUsage:
      type: object
      properties:
        used_bytes:
          type: integer
          format: int64
        max_bytes:
          type: integer
          format: int64
        used_pct:
          type: number
    Stats:
      type: object
      properties:
        disk_usage_total:
          $ref: '#/components/schemas/DiskUsage'
        disk_usage_sessions:
          $ref: '#/components/schemas/DiskUsage'
        disk_usage_history:
          $ref: '#/components/schemas/DiskUsage'
    DeviceRegistrationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    DeviceRegistrationResponse:
      type: object
      properties:
        device_id:
          type: string
        name:
          type: string
        api_key:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
