services:
  fridge-api:
    build: .
    container_name: fridge-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      FRIDGE_SESSIONS_DIR: /data/sessions
    volumes:
      - /home/sixten/fridge-captures/sessions:/data/sessions:ro
