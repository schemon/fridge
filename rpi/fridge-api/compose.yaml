services:
  fridge-api:
    build: .
    container_name: fridge-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      FRIDGE_SESSIONS_DIR: /data/sessions
      FRIDGE_HISTORY_DIR: /data/history
      FRIDGE_MAX_SESSIONS_BYTES: "5368709120"
      FRIDGE_MAX_HISTORY_BYTES: "21474836480"
    volumes:
      - /home/sixten/fridge-captures/sessions:/data/sessions:ro
      - /home/sixten/fridge-captures/history:/data/history:ro
